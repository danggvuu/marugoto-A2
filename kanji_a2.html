    function renderCards(data) {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 40px; color: #888;">Không tìm thấy chữ Hán nào phù hợp!</div>';
            return;
        }

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'kanji-card';

            const examplesHtml = item.examples.map(ex => 
                `<div class="example-line">• <span class="example-jp">${ex.jp}</span> : ${ex.vi}</div>`
            ).join('');

            card.innerHTML = `
                <div class="card-header-bar">
                    <div class="kanji-badge">${item.char}</div>
                    <div class="han-viet-title">${item.hv}</div>
                    <div class="lesson-tag">${item.lessonName}</div>
                </div>

                <div class="card-body">
                    <!-- Left Info Box -->
                    <div class="info-box">
                        <div>
                            <ul class="info-list">
                                <li class="info-item">
                                    <span class="info-bullet">•</span>
                                    <span class="info-label">Ý nghĩa:</span>
                                    <span>${item.meaning}</span>
                                </li>
                                <li class="info-item">
                                    <span class="info-bullet">•</span>
                                    <span class="info-label">Kun:</span>
                                    <span class="info-value-kun">${item.kun}</span>
                                </li>
                                <li class="info-item">
                                    <span class="info-bullet">•</span>
                                    <span class="info-label">On:</span>
                                    <span class="info-value-on">${item.on}</span>
                                </li>
                            </ul>

                            <div class="examples-section">
                                ${examplesHtml}
                            </div>
                        </div>

                        <div class="mnemonic-note">
                            💡 <strong>Mẹo nhớ:</strong> ${item.mnemonic}
                        </div>
                    </div>

                    <!-- Right Column: Formula & Grid Box -->
                    <div class="visual-column">
                        <div class="mnemonic-visual-box">
                            <div class="radical-formula">${item.formula}</div>
                            <div style="font-size: 0.8rem; color: #888;">Chiết tự bộ thủ</div>
                        </div>

                        <div class="kanji-grid-box">
                            <div class="grid-line-h"></div>
                            <div class="grid-line-v"></div>
                            <div class="kanji-char-large">${item.char}</div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterCards() {
        const lesson = document.getElementById('lessonFilter').value;
        const query = document.getElementById('searchInput').value.trim().toLowerCase();

        const filtered = kanjiData.filter(item => {
            const matchLesson = (lesson === 'ALL') || (item.lesson === lesson);
            const matchQuery = !query || 
                item.char.includes(query) ||
                item.hv.toLowerCase().includes(query) ||
                item.meaning.toLowerCase().includes(query) ||
                item.kun.toLowerCase().includes(query) ||
                item.on.toLowerCase().includes(query);
            return matchLesson && matchQuery;
        });

        renderCards(filtered);
    }

    window.addEventListener('DOMContentLoaded', () => {
        filterCards();
    });
